<script>
        // ==========================================
        // FIREBASE CONFIGURATION (Realtime Database)
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyD_geMtD7UVO5lZq7AI5annvw70gWAVhDE",
            authDomain: "quickmart-ce511.firebaseapp.com",
            databaseURL: "https://quickmart-ce511-default-rtdb.firebaseio.com",
            projectId: "quickmart-ce511",
            storageBucket: "quickmart-ce511.firebasestorage.app",
            messagingSenderId: "884034920995",
            appId: "1:884034920995:web:085bfa590c02a981988796",
            measurementId: "G-Q0JX7JZ1PC"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const translations = {
            malayalam: {
                title: "QuickMart Online - കേരളത്തിന്റെ വേഗത്തിലുള്ള പലവ്യഞ്ജന ഡെലിവറി",
                support: "🛒 കേരളത്തിന്റെ സ്വന്തം ഓൺലൈൻ പലവ്യഞ്ജന കട",
                home: "ഹോം (Home)",
                guide: "📱 എങ്ങനെ ഓർഡർ ചെയ്യാം?",
                about: "ഞങ്ങളെക്കുറിച്ച്",
                contact: "ബന്ധപ്പെടാൻ",
                admin: "അഡ്മിൻ",
                cart: "🛒 കാർട്ട്",
                tagline: "✨ എളുപ്പത്തിൽ ഓർഡർ ചെയ്യൂ",
                cartBtn: "🛒 കാർട്ട് പരിശോധിക്കുക",
                sectionTitle: "പുതിയ പലവ്യഞ്ജനങ്ങളും സാധനങ്ങളും",
                addToCart: "🛒 കാർട്ടിലേക്ക് ചേർക്കുക",
                alertText: " കാർട്ടിലേക്ക് ചേർത്തിരിക്കുന്നു! 👍",
                footer: "&copy; 2026 QuickMart Online. All rights reserved. | കേരളത്തിന്റെ സ്വന്തം ഓൺലൈൻ ഷോപ്പ്"
            },
            english: {
                title: "QuickMart Online - Kerala's Fast Grocery Delivery",
                support: "🛒 Kerala's Fast Online Grocery Delivery Store",
                home: "Home",
                guide: "📱 How to Order?",
                about: "About Us",
                contact: "Contact",
                admin: "Admin",
                cart: "🛒 Cart",
                tagline: "✨ Order Easily Online",
                cartBtn: "🛒 Check Cart",
                sectionTitle: "Fresh Groceries & Items",
                addToCart: "🛒 Add to Cart",
                alertText: " added to cart! 👍",
                footer: "&copy; 2026 QuickMart Online. All rights reserved. | Kerala's Fast Online Store"
            }
        };

        let currentSelectedCategory = 'All';
        let cloudProductsList = [];

        function setLanguage(lang) {
            localStorage.setItem('quickMartLang', lang);
            
            document.getElementById('btnMal').classList.remove('active');
            document.getElementById('btnEng').classList.remove('active');

            if (lang === 'english') {
                document.getElementById('btnEng').classList.add('active');
            } else {
                document.getElementById('btnMal').classList.add('active');
            }

            let t = translations[lang];
            document.getElementById('pageTitle').innerText = t.title;
            document.getElementById('topSupportText').innerText = t.support;
            document.getElementById('navHome').innerText = t.home;
            document.getElementById('navGuide').innerText = t.guide;
            document.getElementById('navAbout').innerText = t.about;
            document.getElementById('navContact').innerText = t.contact;
            document.getElementById('navAdmin').innerText = t.admin;
            document.getElementById('navCart').innerText = t.cart;
            document.getElementById('logoTagline').innerText = t.tagline;
            document.getElementById('cartBtnTop').innerText = t.cartBtn;
            document.getElementById('sectionTitle').innerText = t.sectionTitle;
            document.getElementById('footerText').innerHTML = t.footer;

            loadCategories();
            renderProducts(currentSelectedCategory);
        }

        function loadCategories() {
            let categories = JSON.parse(localStorage.getItem('quickMartCategories')) || ['General', 'Groceries', 'Vegetables', 'Fruits'];
            let bar = document.getElementById('categoriesBar');
            if(!bar) return;
            
            let html = `<div class="cat-chip ${currentSelectedCategory === 'All' ? 'active' : ''}" onclick="filterCategory('All', this)">എല്ലാം (All)</div>`;
            categories.forEach(cat => {
                let isActive = currentSelectedCategory === cat ? 'active' : '';
                html += `<div class="cat-chip ${isActive}" onclick="filterCategory('${cat}', this)">${cat}</div>`;
            });
            bar.innerHTML = html;
        }

        function filterCategory(cat, element) {
            currentSelectedCategory = cat;
            document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
            if(element) element.classList.add('active');
            renderProducts(cat);
        }

        // Fetch products from Realtime Database
        function fetchCloudProducts() {
            db.ref('products').on('value', (snapshot) => {
                const data = snapshot.val();
                cloudProductsList = [];
                if (data) {
                    Object.keys(data).forEach(id => {
                        cloudProductsList.push({ id: id, ...data[id] });
                    });
                }
                renderProducts(currentSelectedCategory);
            });
        }

        function renderProducts(selectedCat = 'All') {
            let currentLang = localStorage.getItem('quickMartLang') || 'malayalam';
            let t = translations[currentLang];
            let grid = document.getElementById('productGrid');
            
            let products = cloudProductsList.length > 0 ? cloudProductsList : [
                { nameEn: 'Fresh Apple (1kg)', nameMl: 'ഫ്രഷ് ആപ്പിൾ (1കിലോ)', category: 'Fruits', price: 180, image: 'https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=400' },
                { nameEn: 'Fresh Broccoli (500g)', nameMl: 'ബ്രൊക്കോളി (500ഗ്രാം)', category: 'Vegetables', price: 80, image: 'https://images.unsplash.com/photo-1459411621453-7b03977f4bfc?w=400' },
                { nameEn: 'Organic Milk (1L)', nameMl: 'ഓർഗാനിക് പാൽ (1 ലിറ്റർ)', category: 'Groceries', price: 54, image: 'https://images.unsplash.com/photo-1550583724-b2692b85b150?w=400' },
                { nameEn: 'Fresh Tomatoes (1kg)', nameMl: 'തക്കാളി (1കിലോ)', category: 'Vegetables', price: 40, image: 'https://images.unsplash.com/photo-1592924357228-91a4daadcfea?w=400' }
            ];

            let filtered = selectedCat === 'All' ? products : products.filter(p => (p.category || 'General') === selectedCat);

            grid.innerHTML = '';
            if (filtered.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#666; padding: 20px;">ഈ വിഭാഗത്തിൽ സാധനങ്ങളൊന്നും ലഭ്യമല്ല.</p>';
                return;
            }

            filtered.forEach((p) => {
                // ലാംഗ്വേജ് മലയാളം ആണെങ്കിൽ മലയാളം പേരും, അല്ലെങ്കിൽ ഇംഗ്ലീഷ് പേരും തിരഞ്ഞെടുക്കുന്നു
                let displayName = '';
                if (currentLang === 'malayalam') {
                    displayName = p.nameMl || p.nameEn || p.name || 'Product';
                } else {
                    displayName = p.nameEn || p.name || 'Product';
                }
                
                let imgSrc = '';
                if (p.image && typeof p.image === 'string' && !p.image.includes('<')) {
                    imgSrc = p.image.trim();
                } else if (p.image && typeof p.image === 'string' && p.image.includes('src="')) {
                    try {
                        let match = p.image.match(/src="([^"]+)"/);
                        if (match) imgSrc = match[1];
                    } catch(e) {}
                }

                if (!imgSrc) {
                    imgSrc = 'https://images.unsplash.com/photo-1542838132-92c53300491e?w=400';
                }

                let card = document.createElement('div');
                card.className = 'product-card';

                card.innerHTML = `
                    <img src="${imgSrc}" class="product-image" alt="${displayName}" onerror="this.src='https://images.unsplash.com/photo-1542838132-92c53300491e?w=400'">
                    
                    <div class="product-name-box">
                        <div class="product-name-en" style="font-size: 16px; font-weight: 700; color: #333;">${displayName}</div>
                    </div>
                    
                    <div class="product-price">₹${p.price}</div>
                    
                    <button class="add-to-cart-btn" onclick="addToCart('${displayName}', ${p.price})">
                        ${t.addToCart}
                    </button>
                `;

                grid.appendChild(card);
            });
        }

        function addToCart(name, price) {
            let currentLang = localStorage.getItem('quickMartLang') || 'malayalam';
            let t = translations[currentLang];
            let cart = JSON.parse(localStorage.getItem('quickMartCart')) || JSON.parse(localStorage.getItem('cart')) || [];
            let existing = cart.find(item => item.name === name);
            if(existing) {
                existing.qty = (existing.qty || 1) + 1;
            } else {
                cart.push({ name: name, price: price, qty: 1 });
            }
            localStorage.setItem('quickMartCart', JSON.stringify(cart));
            alert(name + t.alertText);
        }

        window.onload = function() {
            let savedLang = localStorage.getItem('quickMartLang') || 'malayalam';
            setLanguage(savedLang);
            fetchCloudProducts();
        };
    </script>
